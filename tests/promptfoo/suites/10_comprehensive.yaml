            const c = output.replace(/```[\w]*\n?/g,'').replace(/```\n?/g,'').trim();
            const o = JSON.parse(c);
            return ['tool_call','tool'].includes(o.action) && o.tool === 'income_analyzer';
          } catch(e) { return false; }

